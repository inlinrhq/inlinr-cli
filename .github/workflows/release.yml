# Cross-compile inlinr CLI for darwin/linux/windows × amd64/arm64 on every
# `v*` tag, publish a GitHub Release with binaries + SHA256SUMS.txt.
# The VS Code plugin fetches from this release's `latest` alias.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Actions pinned to a commit: this job can write releases, and every
# installed binary updates itself from them. A moved tag cannot change it.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"

      - name: Cross-compile
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          # -trimpath strips local filesystem paths from the binary. It makes
          # the build reproducible — anyone can rebuild the same tag and get a
          # matching SHA256 — which is the only integrity guarantee available
          # while the binaries are unsigned.
          LDFLAGS="-s -w -X main.Version=${VERSION}"
          BUILDFLAGS="-trimpath"
          PKG="./cmd/inlinr"
          for target in \
            "darwin amd64" \
            "darwin arm64" \
            "linux amd64" \
            "linux arm64" \
            "windows amd64"
          do
            set -- $target
            os=$1
            arch=$2
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            echo "→ building $os/$arch"
            GOOS=$os GOARCH=$arch go build $BUILDFLAGS -ldflags "$LDFLAGS" -o "dist/inlinr-${os}-${arch}${ext}" "$PKG"
          done
          cd dist
          sha256sum inlinr-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/inlinr-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
