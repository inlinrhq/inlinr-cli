name: ci

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # gofmt is the Go formatter everyone already runs; CI just makes sure
      # nobody forgot. Lists offending files and fails if there are any.
      - name: Format
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      # Known vulnerabilities in the code paths the binary actually calls,
      # from the standard library to the SQLite driver. The binary updates
      # itself on every machine, so a vulnerable dependency ships everywhere.
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
